; Configuration for the RESEARCH dxgi.dll proxy (not the release add-on, which has no config).
; Copy next to the proxy as lad8vr.ini. With the values below the proxy forwards to the real
; dxgi.dll, logs what the renderer is, and does not change the image. Note that lad_engine_aer
; still installs its two execute breakpoints on game threads; they only patch anything while an
; XR session is running. See docs/TECHNICAL_NOTES.md before enabling anything.

[XR]
; 1 = start an OpenXR session and submit the AER eye images as two quad layers.
; The AER experiment did not produce coherent stereo. Leave at 0 unless working on it.
Enable=0

[AER]
; Half-IPD camera displacement at the per-pass builder, in millimetres (engine units are metres).
EyeOffsetMillimetres=0
; 1 swaps which tagged frame feeds which eye.
SwapEyes=0

[Stereo]
; Retired descriptor / constant-buffer patching experiments. All off.
Enable=0
Passthrough=1
HookMask=0
Probe=0
Calibrate=0
ProofOffset=0
AddonPatch=0
ProofMode=0

[Camera]
; Retired camera scanners and writer traces. Each one uses hardware-breakpoint slots.
Hunt=0
TraceWriter=0
BuilderProof=0
OwnerTrace=0
TestOffsetX=0
